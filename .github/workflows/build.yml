name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore PlayMagic.slnx
      - name: Build
        run: dotnet build PlayMagic.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test PlayMagic.slnx --configuration Release --no-build --no-restore
